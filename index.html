<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LÚMINA - Suscripción</title> <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script> <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #f8e9ef, #eee5f4, #fff5ee); background-size: 300% 300%; animation: backgroundMove 10s ease infinite; } /* CUADRO DEL FORMULARIO */ .form-box { width: 100%; max-width: 470px; background: rgba(255,255,255,.82); border: 1px solid white; border-radius: 28px; padding: 55px 38px; text-align: center; box-shadow: 0 25px 70px rgba(111,76,108,.15); backdrop-filter: blur(15px); animation: entrance 1s ease both; position: relative; } /* DECORACIÓN */ .form-box::before, .form-box::after { content: "✧"; position: absolute; color: #c58ba8; font-size: 25px; animation: sparkle 3s infinite; } .form-box::before { top: 20px; left: 25px; } .form-box::after { bottom: 20px; right: 25px; animation-delay: 1s; } .logo { font-family: 'Playfair Display', serif; letter-spacing: 7px; font-size: 27px; color: #49364d; margin-bottom: 35px; } .line { width: 40px; height: 2px; background: #c58ba8; margin: 0 auto 25px; } h1 { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 500; line-height: 1.2; color: #49364d; margin-bottom: 17px; } h1 span { color: #c58ba8; font-style: italic; } .description { color: #8c7e8e; font-size: 13px; line-height: 1.8; margin-bottom: 30px; } /* ÚNICO CAMPO */ form { display: flex; flex-direction: column; gap: 12px; } input { width: 100%; padding: 17px 20px; border: 1px solid #eadde7; border-radius: 13px; background: #fff; outline: none; font-family: inherit; font-size: 13px; color: #49364d; transition: .3s; } input:focus { border-color: #c58ba8; box-shadow: 0 0 0 4px #c58ba820; } input::placeholder { color: #b7a9b7; } button { width: 100%; padding: 17px; border: none; border-radius: 13px; background: #49364d; color: white; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; transition: .3s; } button:hover { background: #a87998; transform: translateY(-3px); box-shadow: 0 10px 20px #a8799835; } button:disabled { opacity: .6; cursor: wait; transform: none; } #message { min-height: 25px; margin-top: 17px; font-size: 12px; line-height: 1.5; font-weight: 600; } .privacy { color: #aa9eaa; font-size: 10px; margin-top: 10px; } @keyframes entrance { from { opacity: 0; transform: translateY(30px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes sparkle { 0%, 100% { opacity: .4; transform: rotate(0deg) scale(.8); } 50% { opacity: 1; transform: rotate(25deg) scale(1.2); } } @keyframes backgroundMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } } @media(max-width: 480px) { .form-box { padding: 48px 24px; } h1 { font-size: 35px; } } </style> </head> <body> <div class="form-box"> <div class="logo">LÚMINA.</div> <div class="line"></div> <h1>Únete a algo<br><span>especial.</span></h1> <p class="description"> Déjanos tu correo electrónico y recibe novedades, inspiración y una bienvenida especial de LÚMINA. </p> <form id="subscribe-form"> <input type="email" name="user_email" placeholder="Ingresa tu correo electrónico" required > <button type="submit" id="submit-button"> SUSCRIBIRME → </button> </form> <div id="message" role="status" aria-live="polite"></div> <p class="privacy"> Respetamos tu privacidad. Cancela cuando quieras. </p> </div> <script> const PUBLIC_KEY = "2XBaxH3mGgvvBTz0X"; const SERVICE_ID = "service_bf395sc"; const TEMPLATE_ID = "template_mo075p9"; emailjs.init({ publicKey: PUBLIC_KEY }); const form = document.getElementById("subscribe-form"); const button = document.getElementById("submit-button"); const message = document.getElementById("message"); form.addEventListener("submit", async function(event) { event.preventDefault(); button.disabled = true; button.textContent = "ENVIANDO..."; message.textContent = ""; try { await emailjs.sendForm( SERVICE_ID, TEMPLATE_ID, form ); message.textContent = "¡Gracias por suscribirte! Revisa tu correo ♡"; message.style.color = "#548568"; form.reset(); } catch(error) { console.error("Error EmailJS:", error); message.textContent = "No se pudo enviar. Verifica tu configuración."; message.style.color = "#bd536b"; } finally { button.disabled = false; button.textContent = "SUSCRIBIRME →"; } }); </script> </body> </html>
